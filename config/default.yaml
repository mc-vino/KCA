# Конфигурация cashforensics — §6 ТЗ.
#
# Версионируется вместе с кодом. Каждый прогон записывает в отчёт хеш этого
# файла (§12, «версионирование правил»): один и тот же вход при одной версии
# правил обязан давать побитово идентичный выход (§13.5).
#
# Все денежные пороги трактуются как decimal.Decimal, не float (§10).

version: "1.0"

# Счёт операционной кассы — левая часть выгрузки, карточка §3.2.
cash_account: "50.2"

# Целевое сальдо T (§5.8.2). По умолчанию 0; может быть переопределено ключом
# --target или расписанием ниже. §13.8 требует работоспособности при T ≠ 0.
target_balance: 0.00

# Опционально: фонд кассы менялся во времени. Список отсортирован по дате;
# действует последнее правило с `from` <= дата.
target_balance_schedule: []
  # - { from: "2024-01-01", value: 200.00 }

# Seed перестановочного теста §7.3 и любых стохастических процедур.
# Фиксируется в отчёте (§12). Без него детерминированность недостижима.
seed: 20240101

# --------------------------------------------------------------------------- #
# §3.5 Справочник счетов
#
# Счета, не попавшие ни в одну категорию, идут в «прочее» и ОБЯЗАНЫ появиться
# в отчёте отдельной строкой (находка UNKNOWN_ACCOUNT). Молчаливое поглощение
# неизвестного счёта запрещено.
#
# Внимание (§5.4): приход в 1С — только продажи + авансы. Дебетовые проводки
# по 76.9.1 / 76.6 (возврат денег обратно в ящик) идут в «прочее», а не в
# приход. Включение дебета 76.9.1 в приход давало на Кассе 3 579 868,96 вместо
# корректных 579 749,96 и ломало сходимость раскладки.
# --------------------------------------------------------------------------- #
accounts:
  инкассация: ["51", "57.1.1"]
  возвраты:   ["76.9.1", "62.10.1"]
  продажи:    ["90.1.1"]
  авансы:     ["62.4.1"]
  размен:     ["50.1"]
  претензии:  ["76.3.1"]
  прочие:     ["76.6", "76.3.1"]

# --------------------------------------------------------------------------- #
# §3.6 Паттерны классификации
# --------------------------------------------------------------------------- #
patterns:
  # Получатель содержит эту подстроку (регистронезависимо) → инкассация,
  # иначе — возврат клиенту.
  central_cash: "ентральн"

  # Служебные записи опер-лога, НЕ являющиеся возвратами клиентам.
  #
  # Якорь ^ обязателен. Версия без якоря (/суд |^суд|архив|финконтрол/i)
  # отбросила выдачу клиенту по фамилии «Правосуд Дмитрий» (203,93), потому что
  # «Правосуд » содержит «суд ». При добавлении новых паттернов обязательно
  # прогонять регулярку по полному списку получателей и глазами проверять отсев.
  service_recipients: "^суд\\b|^суд\\s|архив пвз|финконтрол"

  # Документ сторно — «Корректировка записей регистров» (§5.5).
  reversal_doc: "корректировк"

# --------------------------------------------------------------------------- #
# §6 Пороги
# --------------------------------------------------------------------------- #
thresholds:
  EPS_FLOOR: 1.00              # порог значимости дневной разницы
  EPS_SUM: 0.50                # допуск парного гашения
  EPS_TIE: 2.00                # допуск сходимости раскладки
  DATE_WIN: 3                  # окно парного гашения, дней
  LONG_WIN: 31                 # окно переноса даты, дней
  MAX_LAG: 3
  LAG_SIGNIFICANT_RATIO: 0.70
  MODAL_BAD: 0.50              # порог ненадёжности дат блока
  MIN_DAYS: 5                  # минимум дней для дневной сверки
  SWEEP_MIN_RATIO: 0.50        # фильтр полноты выемки
  ROUND_MAX: 100.00            # верхняя граница «округления смены»
  AGGREGATE_RATIO: 1.50        # порог режима дневных агрегатов

# --------------------------------------------------------------------------- #
# §7 Гейты доказательности subset-sum
#
# Находка принимается ТОЛЬКО при выполнении всех четырёх гейтов §7.3.
# Без гейтов subset-sum даёт ложные улики: число подмножеств растёт как 2^N,
# и при большом N любая цель окажется достижимой какой-нибудь комбинацией —
# локализация укажет на случайного клиента (§7.1).
#
# Арифметика — в копейках (целые числа), не в float (§10).
# --------------------------------------------------------------------------- #
subset_sum:
  MAX_CANDIDATES: 10           # жёсткий отказ выше 15
  HARD_MAX: 15
  REQUIRE_UNIQUE: true
  MAX_SUBSET_SIZE: null        # null = не ограничивать сверх числа выдач дня
  PERMUTATION_B: 1000
  PERMUTATION_ALPHA: 0.01
  TOLERANCE: 0.005

# --------------------------------------------------------------------------- #
# §5.8.4 Датирование смещения сальдо
#
# Основной метод — PELT (ruptures). Подтверждающие — CUSUM и EWMA.
# Результат выдаётся ОКНОМ, а не точкой: точная дата разладки из ряда сальдо
# не выводима (§16).
# --------------------------------------------------------------------------- #
changepoint:
  method: "pelt"
  model: "l2"
  penalty: "bic"
  min_size: 5
  cusum_k: 0.5
  cusum_h: 5.0
  ewma_lambda: 0.2
  ewma_L: 3.0

# --------------------------------------------------------------------------- #
# §6 Статистика
# --------------------------------------------------------------------------- #
statistics:
  mod_z_threshold: 3.5         # модифицированный z (медиана + MAD)
  iqr_soft: 1.5
  iqr_extreme: 3.0
  benford_min_n: 1700          # ниже — не применять (§15)
  fuzzy_name_threshold: 0.90   # Jaro-Winkler, rapidfuzz

# --------------------------------------------------------------------------- #
# §8.1–8.2 Сигнатуры
#
# Сигнатура повторной выдачи выдаётся ТОЛЬКО по РКО, и в отчёт обязательно
# включается базовая частота по ПКО как контекст: в ПКО повторы — норма
# (клиент забирает несколько одинаковых заказов). Сигнатура не является уликой.
# --------------------------------------------------------------------------- #
signatures:
  repeat_window_minutes: 10
  repeat_min_count: 2
  late_time: "23:59:59"
  business_hours: ["07:00", "23:00"]

# --------------------------------------------------------------------------- #
# §7.5 Материальность
#
# Диапазоны из практики крупных аудиторских фирм: performance materiality
# обычно 50–75 % от overall, порог «явно тривиального» — 3–5 % от overall.
# --------------------------------------------------------------------------- #
materiality:
  benchmark: "period_turnover"
  overall_pct: 0.005           # 0.5 % оборота
  performance_pct: 0.60        # от overall
  trivial_pct: 0.04            # от overall

# --------------------------------------------------------------------------- #
# §5.7.3 Календарь
# --------------------------------------------------------------------------- #
calendar:
  holidays_file: "config/holidays_by.yaml"
