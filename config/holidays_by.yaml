# Праздничные и перенесённые дни Республики Беларусь — §5.7.3 ТЗ.
#
# Используется календарной агрегацией: паттерн «понедельник агрегирует
# выходные» (acc[пн] ≈ ops[пт] + ops[сб] + ops[вс]) должен учитывать, что перед
# праздником нерабочий блок длиннее трёх дней, а перенесённая рабочая суббота,
# наоборот, его разрывает.
#
# ЗАГОТОВКА: списки намеренно пустые. Заполнять по официальному календарю на
# каждый год периода выгрузки (2023–2026 на калибровочных кассах §11.3).
# Пустой файл не является ошибкой — агрегация тогда работает только по
# календарным выходным.
#
# Формат дат — ISO-8601 (ГГГГ-ММ-ДД). Внутри каждого списка даты обязаны идти
# по возрастанию: порядок влияет на диффы регрессионных эталонов (§13.5).

version: "1.0"
country: "BY"

# Нерабочие праздничные дни.
# Постоянные даты РБ: 01.01, 07.01, 08.03, 01.05, 09.05, 03.07, 07.11, 25.12.
# Плавающие: Радуница (9-й день после православной Пасхи).
holidays: []
  # - 2023-01-01   # Новый год
  # - 2023-01-07   # Рождество Христово (православное)
  # - 2023-03-08   # День женщин
  # - 2023-04-25   # Радуница
  # - 2023-05-01   # Праздник труда
  # - 2023-05-09   # День Победы
  # - 2023-07-03   # День Независимости
  # - 2023-11-07   # День Октябрьской революции
  # - 2023-12-25   # Рождество Христово (католическое)

# Рабочие субботы, перенесённые постановлением Совета Министров.
# В эти дни касса работает, и блок выходных не образуется.
working_weekends: []
  # - 2023-04-29

# Дополнительные нерабочие дни, перенесённые с рабочих суббот выше.
transferred_days_off: []
  # - 2023-05-08
