name: Сайт

# Страница исполняет пакет `cashforensics` в браузере через Pyodide. Колесо
# собирается здесь, а не коммитится: иначе оно рано или поздно разойдётся с
# исходниками, и сайт начнёт считать по старым правилам, не сказав об этом.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # `configure-pages` включает Pages, если те выключены, но у уже
      # настроенного сайта источник не меняет — и делает это молча. Так и
      # вышло: Pages собирались из корня `main`, обе сборки отработали
      # «успешно», а в эфире осталась ветка. Пока там лежал корневой
      # index.html, публиковался он; после его удаления Jekyll стал отдавать
      # README.md. Артефакт при этом собирался правильный, и ничто не
      # сигналило, что его никто не публикует.
      #
      # Здесь этот случай становится громким. Источник — настройка
      # репозитория, из workflow её не переключить; поэтому проверка не чинит,
      # а останавливает с указанием, что именно нажать.
      - name: Проверить, что Pages собираются из Actions, а не из ветки
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)
          echo "источник Pages: ${build_type}"
          if [ "${build_type}" != "workflow" ]; then
            echo "::error::Pages собираются из ветки (build_type=${build_type}), и опубликован будет не этот артефакт. Settings → Pages → Build and deployment → Source: GitHub Actions." >&2
            exit 1
          fi

      - name: Установить uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Собрать сайт
        run: |
          set -euo pipefail
          mkdir -p site/wheels site/config
          cp web/index.html web/worker.js web/runner.py site/
          cp web/wheels/*.whl site/wheels/
          cp config/default.yaml config/holidays_by.yaml site/config/
          uv build --wheel --out-dir site/wheels .
          uv run python web/wheel_index.py site/wheels
          # Среда исполнения едет вместе с сайтом: см. web/vendor_pyodide.py.
          # Скачивание с CDN — зависимость сборки, а не страницы, и каждый файл
          # проверяется по контрольной сумме.
          uv run python web/vendor_pyodide.py site/pyodide

      # Данные кассы обрабатываются в браузере и никуда не уходят, но сам
      # репозиторий публичный — выгрузок и отчётов на сайте быть не должно.
      - name: Проверить, что на сайт не попали выгрузки
        run: |
          if find site -name '*.xlsx' | grep -q .; then
            echo "на сайте оказалась выгрузка .xlsx — публиковать нельзя" >&2
            find site -name '*.xlsx' >&2
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
